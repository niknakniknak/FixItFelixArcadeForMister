[global]
author=["Chris Watson"]
webpage="https://github.com/niknakniknak/FixItFelixArcadeForMister"

[parse]
sourcefile=[ "felix.cpp" ]
main_setnames=[ "felixjr" ]

[Audio]
volume = [
    { machine="felixjr", value=0xB4 },
]

[buttons]
Names = [
    { names="Jump,Fix" },
]

[ROM]
regions = [
    { name="maincpu" },
    { name="gfx1",    start="JTFRAME_BA1_START" },
    { name="gfx2",    start="JTFRAME_BA2_START" },
    { name="samples", start="JTFRAME_BA3_START" },
    { name="proms",   start="JTFRAME_PROM_START" },
]

order = [ "maincpu", "gfx1", "gfx2", "samples", "proms" ]

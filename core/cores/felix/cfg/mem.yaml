clocks:
  clk48:
    - mul: 1
      div: 6
      gate: [ main ]
      outputs:
        - cpu_cen
    - mul: 2
      div: 7
      outputs:
        - cen_pxl2
        - cen_pxl
    - mul: 1
      div: 3
      outputs:
        - pcm_cen
audio:
  rsum: 10k
  gain: 1.99
  channels:
    - { name: pcm, data_width: 15, unsigned: false, rsum: 10k, fir: fir_felix_8k.csv }
sdram:
  banks:
    - buses:
      - name: main
        addr_width: 17
        data_width: 8
    - buses:
      - name: bgrom
        addr_width: 16
        data_width: 32
      - name: fgrom
        addr_width: 16
        data_width: 32
    - buses:
      - name: obj
        addr_width: 18
        data_width: 32
    - buses:
      - name: smp
        addr_width: 21
        data_width: 8
bram:
  - name: ram
    addr_width: 12
    data_width: 8
    rw: true
    addr: cpu_addr
    din: cpu_dout
  - name: bg0
    addr_width: 12
    data_width: 16
    addr: bgmap_addr
    dual_port:
      name: bg0c
      addr: cpu_addr[11:1]
      din: "{2{cpu_dout}}"
      dout: bg0c_dout
      we: bg0c_we
      rw: true
  - name: bg1
    addr_width: 12
    data_width: 16
    addr: bgmap_addr
    dual_port:
      name: bg1c
      addr: cpu_addr[11:1]
      din: "{2{cpu_dout}}"
      dout: bg1c_dout
      we: bg1c_we
      rw: true
  - name: fg0
    addr_width: 12
    data_width: 16
    addr: fgmap_addr
    dual_port:
      name: fg0c
      addr: cpu_addr[11:1]
      din: "{2{cpu_dout}}"
      dout: fg0c_dout
      we: fg0c_we
      rw: true
  - name: fg1
    addr_width: 12
    data_width: 16
    addr: fgmap_addr
    dual_port:
      name: fg1c
      addr: cpu_addr[11:1]
      din: "{2{cpu_dout}}"
      dout: fg1c_dout
      we: fg1c_we
      rw: true
  - name: oram
    addr_width: 10
    data_width: 8
    dual_port:
      name: ocpu
      addr: cpu_addr[9:0]
      din: cpu_dout
      dout: objram_dout
      we: objram_we
      rw: true
  - name: nvram
    addr_width: 10
    data_width: 8
    rw: true
    addr: cpu_addr[9:0]
    din: nvram_din
    ioctl: { save: true, restore: true, order: 0 }
  - name: pallo
    addr_width: 10
    data_width: 8
    prom: true
  - name: palhi
    addr_width: 10
    data_width: 8
    prom: true
